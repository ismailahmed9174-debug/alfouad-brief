<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL FOUAD Client Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700&amp;family=Montserrat:wght@400;500;600;700;800&amp;display=swap">
<style>
 
:root{
  --red:#E30613; --navy:#0F1E2E; --white:#FFFFFF; --light:#F5F5F5; --soft:#D9D9D9; --cool:#6B6B6B; --mint:#DDF3EE;
  --font:'Montserrat',Arial,Helvetica,sans-serif;
  --arfont:'Cairo','Segoe UI',Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);color:var(--navy);background:var(--light);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

 
.top{background:var(--white);border-bottom:3px solid var(--red)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.top img{height:52px;width:auto;display:block}
.top .tag{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);text-align:right}
.top .tag b{color:var(--red)}

 
.progress{background:var(--white);border-bottom:1px solid var(--soft);position:sticky;top:0;z-index:5}
.progress .wrap{padding-block:12px}
.steps{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;list-style:none;margin:0;padding:0}
.steps li{min-width:0}
.steps button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.steps .bar{height:4px;border-radius:2px;background:var(--soft);transition:background .2s}
.steps .lbl{font-size:9.5px;font-weight:700;letter-spacing:.08em;color:var(--cool);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .lbl span{color:var(--red);margin-right:4px}
.steps li.done .bar{background:var(--navy)}
.steps li.cur .bar{background:var(--red)}
.steps li.cur .lbl{color:var(--navy)}
.steps button:focus-visible .bar{outline:2px solid var(--navy);outline-offset:3px}
.count{display:none;font-size:12px;font-weight:600;color:var(--cool);margin-top:8px}

 
main{padding-block:32px 64px;min-height:calc(100vh - 200px)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red);margin:0 0 6px}
.eyebrow i{font-style:normal;color:var(--cool)}
h1{font-size:clamp(30px,5vw,46px);line-height:1.05;font-weight:800;margin:0 0 6px;text-wrap:balance}
h1 .r{color:var(--red)}
h2{font-size:clamp(22px,3.4vw,30px);line-height:1.15;font-weight:800;margin:0 0 8px;text-wrap:balance}
.lead{color:var(--cool);max-width:62ch;margin:0 0 24px}
.rule{width:64px;height:4px;background:var(--red);margin:18px 0 22px}

.card{background:var(--white);border:1px solid var(--soft);border-radius:6px;overflow:hidden}
.thead{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);background:var(--navy);color:var(--white);font-size:10.5px;font-weight:700;letter-spacing:.18em}
.thead div{padding:10px 18px}
.q{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr);border-top:1px solid var(--soft)}
.q:first-of-type{border-top:0}
.q .ask{background:var(--light);border-right:3px solid var(--red);padding:18px;font-weight:700;font-size:14px;line-height:1.45}
.q .ans{padding:14px 18px 16px;display:grid;gap:12px}
.ar{font-family:var(--arfont);direction:rtl;text-align:right;color:var(--cool);font-weight:600;margin:0}
.h2ar{font-size:clamp(18px,2.6vw,22px);margin:-2px 0 10px;text-align:left;direction:rtl;display:block}
h2 + .h2ar{text-align:left}
.lead.ar{font-weight:500;font-size:14.5px;line-height:1.8;margin-top:-14px}
.ask .ar{font-size:14px;line-height:1.7;margin-top:8px}
.index li{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.index li .ar{font-size:13px;letter-spacing:0;font-weight:600}
.att{border-top:1px dashed var(--soft);padding-top:12px}
.f.att > label{color:var(--red);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.att > label .ar{color:var(--red)}
.attrow{display:flex;gap:8px;flex-wrap:wrap}
.attrow input[type=text]{flex:1 1 220px;min-width:0}
.up{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy);background:var(--white);border:1.5px dashed var(--navy);border-radius:4px;padding:8px 14px;white-space:nowrap}
.up:hover{background:var(--light)}
.up:focus-within{outline:2px solid var(--red);outline-offset:2px}
.up input{position:absolute;width:1px;height:1px;opacity:0}
.files{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.files li{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;background:var(--light);border-radius:4px;padding:6px 10px;min-width:0}
.files li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.files button{all:unset;cursor:pointer;font-size:12px;font-weight:700;color:var(--red)}
.files button:focus-visible{outline:2px solid var(--navy)}
.ferr{font-size:12px;font-weight:600;color:var(--red);margin:6px 0 0}
.fhint{font-size:11.5px;color:var(--cool);margin:6px 0 0}
.f label.bil{display:flex;justify-content:space-between;align-items:baseline;gap:4px 12px;flex-wrap:wrap}
.f label.bil .ar{font-weight:600;font-size:12.5px}
.f label{display:block;font-size:11.5px;font-weight:700;color:var(--cool);margin-bottom:4px}
.f textarea,.f input{width:100%;font:inherit;font-size:14.5px;color:var(--navy);background:var(--mint);border:1.5px solid transparent;border-radius:4px;padding:9px 11px;resize:none;min-height:42px;line-height:1.4;transition:border-color .15s,background .15s}
.f textarea{unicode-bidi:plaintext}
.f textarea:focus,.f input:focus{outline:none;border-color:var(--navy);background:var(--white)}
.f textarea::placeholder,.f input::placeholder{color:#8a9a97}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label{margin:0;cursor:pointer;font-size:13px;font-weight:600;color:var(--navy);background:var(--white);border:1.5px solid var(--soft);border-radius:999px;padding:8px 16px}
.chips input:checked+label{background:var(--navy);border-color:var(--navy);color:var(--white)}
.chips input:focus-visible+label{outline:2px solid var(--red);outline-offset:2px}

.index{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:0 32px;margin:0 0 28px;padding:0;list-style:none;max-width:720px}
.index li{border-bottom:1px solid var(--soft);padding:12px 0;font-size:12.5px;font-weight:700;letter-spacing:.06em}
.index li span{color:var(--red);margin-right:12px}
.how{background:var(--mint);border-left:4px solid var(--red);padding:16px 20px;max-width:720px;margin-bottom:28px}
.how p{margin:4px 0 0;font-size:14px}
.how .eyebrow{margin:0}

 
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:24px;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;font-size:14px;letter-spacing:.04em;border-radius:4px;padding:13px 26px;cursor:pointer;border:1.5px solid var(--navy);background:var(--white);color:var(--navy)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--white)}
.btn.primary:hover{background:#c40511}
.btn:hover{filter:brightness(.97)}
.btn:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
.saved{font-size:12px;color:var(--cool)}
.note{font-size:12.5px;color:var(--cool);margin-top:18px}
footer{border-top:1px solid var(--soft);background:var(--white)}
footer .wrap{padding-block:14px;display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;letter-spacing:.18em;color:var(--cool)}

@media (max-width:720px){
  .top img{height:40px}
  .thead{display:none}
  .q{grid-template-columns:1fr}
  .q .ask{border-right:0;border-left:3px solid var(--red);padding:14px 16px}
  .q .ans{padding:14px 16px 18px}
  .steps{gap:4px}
  .steps .lbl{display:none}
  .count{display:block}
  .index{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}
  .nav .btn{flex:1}
}
.err{background:#FDECEE;border-left:4px solid var(--red);padding:12px 16px;font-size:13.5px;font-weight:600;margin-top:18px}
.f.missing textarea{border-color:var(--red);background:#FDECEE}
.req{color:var(--red)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.thanks{background:var(--white);border:1px solid var(--soft);border-top:4px solid var(--red);border-radius:6px;padding:32px;max-width:720px}
.thanks .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn[disabled]{opacity:.6;cursor:wait}
#printdoc{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:10pt}
  .top,.progress,main,footer{display:none!important}
  #printdoc{display:block}
  .pd-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2.5px solid var(--red);padding-bottom:8px;margin-bottom:14px}
  .pd-head img{height:46px}
  .pd-head .tag{font-size:8pt;font-weight:700;letter-spacing:.18em}
  .pd-head .tag b{color:var(--red)}
  .pd-meta{font-size:8.5pt;color:var(--cool);margin:0 0 10px}
  .pd-sec{margin-top:16px}
  .pd-sec .eyebrow{font-size:7.5pt;margin-bottom:2px}
  .pd-sec h3{font-size:15pt;font-weight:800;margin:0 0 8px;break-after:avoid}
  .pd-row{display:grid;grid-template-columns:36% 1fr;border-top:1px solid var(--soft);break-inside:avoid}
  .pd-row .ask{background:var(--light);border-right:2.5px solid var(--red);padding:7px 10px;font-weight:700;font-size:8.8pt;line-height:1.35}
  .pd-row .ans{padding:6px 10px;display:grid;gap:5px}
  .pd-f .l{font-size:7.3pt;font-weight:700;color:var(--cool)}
  .pd-f .v{font-size:9.3pt;white-space:pre-wrap;unicode-bidi:plaintext}
  .pd-f .v.empty{color:#aaa}
  .pd-row .ask .ar{font-size:8.6pt;margin-top:3px;line-height:1.5}
  .pd-sec .h2ar{font-size:11pt;margin:-4px 0 6px}
  .pd-close{font-size:8pt;color:var(--cool);margin-top:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function renderSteps(){

  $('#count').textContent = step&&step<9 ? `Section ${step} of 8 · ${SECTIONS[step-1].title}` : '';
  $('#foot').textContent = step&&step<9 ? `${step} / 8` : '';
}

function fieldHTML(f){
  const v=data[f.key]||'';
  if(f.att){ const list=FILES[f.key]||[];
    return `<div class="f att"><label for="${f.key}"><span>${esc(ATT_EN)}</span><span class="ar">${esc(ATT_AR)}</span></label>
      <div class="attrow"><input type="text" id="${f.key}" name="${f.key}" dir="auto" value="${esc(v)}" placeholder="Paste a link (Google Drive, Dropbox, website…)">
      <label class="up">Upload files<input type="file" multiple data-files="${f.key}" aria-label="Upload files for this question"></label></div>
      ${list.length?`<ul class="files">${list.map((x,i)=>`<li><span>${esc(x.name)} · ${fmtSize(x.size)}</span><button type="button" data-rm="${f.key}|${i}">Remove</button></li>`).join('')}</ul>`:''}
      ${fileErr[f.key]?`<p class="ferr" role="alert">${esc(fileErr[f.key])}</p>`:''}
      ${list.length?`<p class="fhint">Files are sent when you submit. They are not kept if you close this page.</p>`:''}</div>`;
  }
  const la=AR.labels[f.label]||'';
  if(f.choices) return `<div class="f"><label class="bil"><span>${esc(f.label)}</span><span class="ar">${esc(la)}</span></label><div class="chips" role="radiogroup">${f.choices.map((c,i)=>`<input type="radio" name="${f.key}" id="${f.key}-${i}" value="${esc(c)}" ${v===c?'checked':''}><label for="${f.key}-${i}">${esc(c)} · <span class="ar" style="display:inline;color:inherit">${esc(AR.labels[c]||'')}</span></label>`).join('')}</div></div>`;
  const req=REQUIRED.includes(f.key);
  return `<div class="f${req&&missing.includes(f.key)?' missing':''}"><label class="bil" for="${f.key}"><span>${esc(f.label)}${req?' <span class="req">*</span>':''}</span><span class="ar">${esc(la)}</span></label><textarea id="${f.key}" name="${f.key}" rows="1" dir="auto"${req?' required':''}>${esc(v)}</textarea></div>`;
}

  }
}
function grow(t){ t.style.height='auto'; t.style.height=(t.scrollHeight+3)+'px'; }

document.addEventListener('input',e=>{
  const t=e.target; if(t.type==='file') return; if(!t.name||t.name==='_hp') return;
  data[t.name]=t.value; if(t.tagName==='TEXTAREA') grow(t); saveDraft();
});
document.addEventListener('change',e=>{
  const t=e.target; if(t.type!=='file') return;
  const key=t.dataset.files, list=FILES[key]||(FILES[key]=[]); fileErr[key]='';
  for(const f of t.files){
    if(f.size>MAX_FILE){ fileErr[key]=`${f.name} is larger than 10 MB. Share it as a link instead.`; continue; }
    if(totalSize()+f.size>MAX_TOTAL){ fileErr[key]=`Total uploads would pass 25 MB. Share ${f.name} as a link instead.`; continue; }
    list.push(f);
  }
  const y=window.scrollY; render(); window.scrollTo(0,y);
});
document.addEventListener('click',e=>{
  const rm=e.target.closest('[data-rm]');
  if(rm){ const [k,i]=rm.dataset.rm.split('|'); FILES[k].splice(+i,1); fileErr[k]=''; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if(e.target.closest('#pdf')){ buildPrint(); window.print(); return; }
  if(e.target.closest('#submit')){ submit(); return; }
  if(e.target.closest('#again')){ data={}; for(const k in FILES) delete FILES[k]; try{localStorage.removeItem(DRAFT_KEY)}catch(_){} step=0; render(); return; }
  const g=e.target.closest('[data-go]'); if(!g) return;
  step=+g.dataset.go; render(); window.scrollTo({top:0,behavior:'smooth'});
});

    <p class="pd-meta">${esc(data['s01.q2.1']||'')}${data['s01.q2.1']?' · ':''}Prepared ${when}</p>
    ${SECTIONS.map(s=>`<div class="pd-sec"><p class="eyebrow">Section ${s.n} <i>/ Business brief</i></p><h3>${s.title}</h3><p class="ar h2ar">${esc(s.ar)}</p>
      ${s.rows.map(([q,fs,qa])=>`<div class="pd-row"><div class="ask">${esc(q)}<p class="ar">${esc(qa)}</p></div><div class="ans">${fs.map(f=>{let v=(data[f.key]||'').trim(); if(f.att){ const n=(FILES[f.key]||[]).map(x=>x.name).join(', '); if(n) v=(v?v+'\n':'')+'Files: '+n; if(!v) return ''; } return `<div class="pd-f"><div class="l">${esc(f.label)} <span class="ar" style="display:inline">${esc(f.att?ATT_AR:(AR.labels[f.label]||''))}</span></div><div class="v${v?'':' empty'}" dir="auto">${v?esc(v):'—'}</div></div>`}).join('')}</div></div>`).join('')}</div>`).join('')}
    <p class="pd-close">${CLOSING}</p>`;
}

async function submit(){
  if(sending) return;
  missing=REQUIRED.filter(k=>!(data[k]||'').trim());
  if(missing.length){
    errMsg=''; step=1; render(); window.scrollTo({top:0});
    const first=document.getElementById(missing[0]); if(first){ first.focus(); first.scrollIntoView({block:'center'}); }
    return;
  }
  if((document.getElementById('website_hp')||{}).value){ step=9; render(); return; } // spam bot
  const GAS = window.google && google.script && google.script.run;
  if(!GAS && (!SUBMIT_URL || SUBMIT_URL.indexOf('PASTE')===0)){ errMsg='This form is not connected yet. Please contact the Al Fouad team.'; render(); return; }
  sending=true; errMsg=''; render();
  try{
    const files=[]; for(const [key,list] of Object.entries(FILES)) for(const f of list) files.push({key,name:f.name,mimeType:f.type||'application/octet-stream',data:await readB64(f)});
    const payload={ submittedAt:new Date().toISOString(), businessName:data['s01.q2.1']||'', fields:allFields(), files };
    if(GAS){
      await new Promise((ok,no)=>google.script.run
        .withSuccessHandler(r=> r&&r.ok ? ok() : no(new Error((r&&r.error)||'Not saved')))
        .withFailureHandler(no).submitBrief(payload));
    } else {
      await fetch(SUBMIT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    }
    sending=false; try{localStorage.removeItem(DRAFT_KEY)}catch(_){} for(const k in FILES) delete FILES[k];
    step=9; render(); window.scrollTo({top:0});
  }catch(err){
    sending=false; errMsg='We could not send your brief. Check your internet connection and press Submit again. Your answers are still saved on this device.'; render();
  }
}
window.addEventListener('beforeprint',buildPrint);
render();
</script>
